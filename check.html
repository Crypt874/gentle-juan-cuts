<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html" aria-label="The Gentle Juan Cuts"><span class="logo-img" role="img" aria-label="The Gentle Juan Cuts"></span></a>
      <nav>
        <a href="index.html">Back to Home</a>
        <a class="user-icon" id="staff-link" href="admin/login.html" aria-label="Staff login" title="Staff login">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-card">
      <h1>My Booking</h1>
      <p class="hint">See if the shop confirmed your appointment, or cancel it.</p>

      <form id="find-form" novalidate>
        <label for="code">Booking code or link</label>
        <div class="track-row">
          <input id="code" type="text" maxlength="300" placeholder="Paste your booking link or code" autocomplete="off">
          <button class="btn" type="submit">Check</button>
        </div>
        <p class="hint">You got the link right after booking. We can't look bookings up by name or phone number, to keep everyone's details private.</p>
      </form>

      <div class="message" id="message" role="alert"></div>

      <div id="result" style="display:none">
        <div class="appt-head"><h2 id="r-status-title" style="margin:0"></h2><span class="badge" id="r-badge"></span></div>
        <p id="r-note"></p>
        <dl class="summary" id="r-summary"></dl>
        <div class="actions">
          <button class="btn btn-danger" type="button" id="cancel-btn" style="display:none">Cancel this booking</button>
          <a class="btn btn-outline" href="book.html">Book another</a>
          <a class="btn btn-outline" href="index.html">Back to Home</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/check.js"></script>
  <script type="module" src="js/auth-icon.js"></script>
  <script type="module" src="js/pwa.js"></script>
